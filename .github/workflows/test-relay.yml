name: Test Relay

# Public-repo automated test channel for the private Macrition system
# (user-directed 2026-10-24; private-repo Actions minutes are exhausted —
# see the diagnosis in the private repo coordination channel, task-292).
#
# WHAT IT DOES: runs the full PHPUnit wall (and the tracked-surface
# hygiene scan) at an EXACT private-repo SHA, on free public-repo
# runners.
#
# NO-LEAK DESIGN (all three rules enforced):
#   1. The private source is fetched to the EPHEMERAL runner disk only
#      (actions/checkout with a token secret, persist-credentials:
#      false). Nothing is ever committed to this public repo.
#   2. The PUBLIC run log carries ONLY: the tested SHA, suite verdicts,
#      and aggregate counts. Every step whose output could embed
#      private-derived metadata (composer, artisan, phpunit detail) is
#      redirected into detail logs that are never printed.
#   3. Detailed evidence (full logs + JUnit) is AES-256-encrypted with a
#      passphrase secret before upload; the artifact is decryptable
#      only by the secret holder.
#
# TRIGGER SURFACE: workflow_dispatch ONLY — collaborators only (forks
# and anonymous users can neither dispatch nor read secrets).
#
# NOTE (hardening recommendation, task-292): the checkout reuses the
# existing OPS_GH_PAT secret (least new surface). A dedicated READ-ONLY
# deploy key on the private repo would be narrower; the private-repo
# PAT available to agents lacks Administration:write to create it, so
# that upgrade is left to the account owner.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-hex commit SHA to test (default: integration/product-reconstruction head)'
        required: false
        default: ''
      suites:
        description: 'wall | hygiene | wall,hygiene'
        required: false
        default: 'wall,hygiene'

permissions:
  contents: read

concurrency:
  group: test-relay
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      APP_DIR: src/workspace/macrition-laravel
    steps:
      - name: Resolve target SHA
        env:
          GH_PAT: ${{ secrets.OPS_GH_PAT }}
          SHA_INPUT: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SHA_INPUT" ]; then
            echo "$SHA_INPUT" | grep -qE '^[0-9a-f]{40}$' || { echo "ERR: sha must be 40-hex"; exit 2; }
            echo "TARGET_SHA=$SHA_INPUT" >> "$GITHUB_ENV"
          else
            HEAD=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/repos/Macrition/Storing-System-Macrition/branches/integration/product-reconstruction" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["commit"]["sha"])')
            echo "$HEAD" | grep -qE '^[0-9a-f]{40}$' || { echo "ERR: head resolve failed"; exit 2; }
            echo "TARGET_SHA=$HEAD" >> "$GITHUB_ENV"
          fi

      - name: Checkout private source at exact SHA (ephemeral, never persisted here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Macrition/Storing-System-Macrition
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OPS_GH_PAT }}
          persist-credentials: false
          path: src

      - name: Setup PHP 8.4 (mirrors the certified lane pin)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, sodium, sqlite3, pdo_sqlite, dom, fileinfo, gd, gmp
          coverage: none

      - name: Install exact dependencies (output private)
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-interaction --no-progress --prefer-dist --quiet > ../../detail-install.log 2>&1

      - name: Prepare isolated SQLite runtime (output private)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          {
            cp .env.example .env
            touch database/database.sqlite
            php artisan key:generate --force
            php artisan migrate --seed --force
          } > ../../detail-boot.log 2>&1

      - name: Hygiene scan (tracked-surface secret gate at the exact SHA)
        if: contains(github.event.inputs.suites, 'hygiene')
        working-directory: src
        run: |
          set -euo pipefail
          rc=0
          {
            patterns=(
              'SSH Key Pair Private.zip'
              'scripts/ssh-deploy/browser-probe.json'
              'scripts/ssh-deploy/probe-user.json'
              'scripts/ssh-deploy/probe-jar.json'
              'scripts/ssh-deploy/keys/*'
            )
            hits=0
            for pat in "${patterns[@]}"; do
              while IFS= read -r f; do
                echo "FORBIDDEN: ${f} (pattern: ${pat})"
                hits=$((hits + 1))
              done < <(git ls-files -- "$pat")
            done
            keyhits=$(git ls-files -z -- '*.pem' '*.key' 'scripts/ssh-deploy/keys/*' 2>/dev/null | xargs -0 -r grep -l "PRIVATE KEY" 2>/dev/null | wc -l || true)
            echo "hygiene forbidden-file hits: ${hits}"
            echo "hygiene private-key-material hits: ${keyhits}"
            test "$hits" -eq 0 -a "${keyhits:-0}" -eq 0
          } > detail-hygiene.log 2>&1 || rc=$?
          if [ $rc -eq 0 ]; then
            echo "HYGIENE: OK (tracked surface clean at $TARGET_SHA)"
          else
            echo "HYGIENE: FAILED (see encrypted artifact; counts in detail log)"
          fi
          exit $rc

      - name: Verify clean tracked tree (the S291 builder precondition)
        working-directory: src
        run: |
          set -euo pipefail
          DIRTY=$(git status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "ERR: tracked tree dirty before the wall (the S291 builder tests require clean):"
            echo "$DIRTY" | sed 's/^/  /' | head -10
            exit 3
          fi
          echo "tracked tree clean at $TARGET_SHA"

      - name: Full PHPUnit wall (the e150 slice discipline, hosted)
        if: contains(github.event.inputs.suites, 'wall')
        working-directory: ${{ env.APP_DIR }}
        env:
          JUNIT_DIR: ${{ runner.temp }}/hosted-junit
        run: |
          set -uo pipefail
          mkdir -p "$JUNIT_DIR"
          cat > /tmp/parse_junit.py <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              tops = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              t = a = f = e = s = 0
              for ts in tops:
                  t += int(ts.get('tests', 0) or 0)
                  a += int(ts.get('assertions', 0) or 0)
                  f += int(ts.get('failures', 0) or 0)
                  e += int(ts.get('errors', 0) or 0)
                  s += int(ts.get('skipped', 0) or 0)
              print(t, a, f, e, s)
          except Exception:
              print(0, 0, 1, 0, 0)
          PYEOF
          T_TOTAL=0; A_TOTAL=0; F_FILES=0; FAILS=0; ERRS=0; SKIPS=0; RC=0
          : > ../../detail-wall.log
          # the e150 channel law (v4): per-file slices, the migration-manifest
          # side-effect restored at each boundary. LegacyImporterTest
          # regenerates the tracked database/migration-manifest.json with a
          # fresh generated_at; left unrestored it dirties the tracked tree and
          # fails the S291 builder-execution tests later in the suite (the
          # known channel caveat, honored per-slice by the e150 discipline).
          for SUITE_DIR in tests/Feature tests/Unit; do
            for FILE in $(ls "$SUITE_DIR"/*.php | sort); do
              BASE=$(basename "$FILE" .php)
              OUT=$(timeout 600 php vendor/bin/phpunit --no-coverage --log-junit "$JUNIT_DIR/$BASE.junit.xml" "$FILE" 2>&1)
              PRC=$?
              echo "$OUT" >> ../../detail-wall.log
              LINE=$(python3 /tmp/parse_junit.py "$JUNIT_DIR/$BASE.junit.xml")
              read -r NT NA NF NE NS <<< "$LINE"
              T_TOTAL=$((T_TOTAL+NT)); A_TOTAL=$((A_TOTAL+NA)); F_FILES=$((F_FILES+1))
              FAILS=$((FAILS+NF)); ERRS=$((ERRS+NE)); SKIPS=$((SKIPS+NS))
              if [ "$PRC" -ne 0 ]; then RC=1; echo "SLICE-FAIL: $BASE (rc=$PRC; $NT tests / $NA assertions / $NF failures / $NE errors)" >> ../../detail-wall.log; fi
              git -C "$GITHUB_WORKSPACE/src" checkout -- workspace/macrition-laravel/database/migration-manifest.json 2>>../../detail-wall.log || true
            done
          done
          cat > ../../wall-summary.json <<JSONEOF
          {"test_classes": $F_FILES, "tests": $T_TOTAL, "assertions": $A_TOTAL, "failures": $FAILS, "errors": $ERRS, "skipped": $SKIPS}
          JSONEOF
          echo "driver totals: files=$F_FILES tests=$T_TOTAL assertions=$A_TOTAL failures=$FAILS errors=$ERRS skipped=$SKIPS" >> ../../detail-wall.log
          cat ../../wall-summary.json
          exit $RC

      - name: Wall verdict (public aggregate only)
        if: always() && contains(github.event.inputs.suites, 'wall')
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f ../../wall-summary.json ] || [ ! -s ../../wall-summary.json ]; then
            echo "VERDICT: RED (no summary produced — see encrypted artifact)"
            exit 1
          fi
          SUMMARY=$(cat ../../wall-summary.json)
          echo "WALL at $TARGET_SHA: $SUMMARY"
          python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          if s["failures"] or s["errors"]:
              print("VERDICT: RED"); sys.exit(1)
          print("VERDICT: GREEN")' "$SUMMARY"

      - name: Diagnose tracked-tree state (post-wall)
        if: always() && contains(github.event.inputs.suites, 'wall')
        working-directory: src
        run: |
          set -uo pipefail
          {
            echo "== git status --porcelain --untracked-files=no =="
            git status --porcelain --untracked-files=no
            echo "== git diff --stat HEAD =="
            git diff --stat HEAD | tail -20
            echo "== git diff HEAD (max 200 lines) =="
            git diff HEAD | head -200
          } > detail-gitstatus.log 2>&1 || true
          DIRTY_N=$(grep -c '^ M\|^M\|^ D\|^D\|^ T\|^T' detail-gitstatus.log || true)
          echo "post-wall tracked-tree state: ${DIRTY_N} dirty entries (detail encrypted)"

      - name: Encrypt detailed evidence
        if: always()
        working-directory: src
        env:
          RELAY_PASS: ${{ secrets.TEST_RELAY_PASS }}
        run: |
          set -euo pipefail
          [ -f detail-install.log ] || : > detail-install.log
          [ -f detail-boot.log ] || : > detail-boot.log
          [ -f detail-hygiene.log ] || : > detail-hygiene.log
          [ -f detail-wall.log ] || : > detail-wall.log
          [ -f wall-summary.json ] || : > wall-summary.json
          [ -f detail-gitstatus.log ] || : > detail-gitstatus.log
          if [ -d "${RUNNER_TEMP:-/tmp}/hosted-junit" ]; then
            mkdir -p junit-receipts && cp "${RUNNER_TEMP:-/tmp}/hosted-junit"/*.junit.xml junit-receipts/ 2>/dev/null || true
          fi
          tar czf evidence.tgz detail-install.log detail-boot.log detail-hygiene.log detail-wall.log detail-gitstatus.log wall-summary.json junit-receipts
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in evidence.tgz -out "$GITHUB_WORKSPACE/evidence.tgz.enc" -pass env:RELAY_PASS
          rm -f evidence.tgz detail-*.log wall-summary.json; rm -rf junit-receipts

      - name: Upload encrypted artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-relay-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence.tgz.enc
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup runner source (defense in depth)
        if: always()
        run: rm -rf src
