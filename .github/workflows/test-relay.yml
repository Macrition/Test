name: Test Relay (private wall, hosted minutes)

# (founder-e2e, 2026-11-14) The private repository's hosted runners fail
# at the billing/spending-limit boundary (every failed run shows
# steps_count=0 — the signature the secret-hygiene header documents).
# This relay executes the SAME certification legs on THIS public
# repository's hosted minutes. THE SOURCE NEVER LANDS IN THIS REPO:
# the workflow checks the private head out onto the EPHEMERAL runner
# disk via a read-only fine-grained PAT stored as an encrypted secret,
# runs the suite there, and publishes ONLY the pass/fail verdict and
# the assertion counts (never file contents, never diffs, never logs
# beyond the JUnit rollup). Dispatch-only: no push, no pull_request
# trigger — the private credential can never execute against untrusted
# code paths, and the PAT is scoped read-only to the single private
# repository.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The private repo ref to certify (branch, tag or sha)'
        required: false
        default: 'main'
      suite:
        description: 'PHPUnit filter (empty = the full wall)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: test-relay-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  wall:
    name: Certification wall (${{ github.event.inputs.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: The private head, onto the ephemeral disk only
        uses: actions/checkout@v4
        with:
          repository: Macrition/Storing-System-Macrition
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          persist-credentials: false
          clean: true

      - name: PHP 8.4 + extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite3, gd, intl, zip, curl
          coverage: none

      - name: Composer dependencies (cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: The certification wall
        run: |
          set -euo pipefail
          FILTER="${{ github.event.inputs.suite }}"
          if [ -n "$FILTER" ]; then
            vendor/bin/phpunit --filter "$FILTER" --log-junit /tmp/junit.xml --no-progress 2>&1 | tail -5
          else
            vendor/bin/phpunit --log-junit /tmp/junit.xml --no-progress 2>&1 | tail -5
          fi

      - name: The verdict rollup (counts only — no source)
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p='/tmp/junit.xml'
          if not os.path.exists(p):
              print('VERDICT: the wall did not produce a JUnit report (infra failure)'); raise SystemExit(0)
          r=ET.parse(p).getroot()
          suites=[r] if r.tag=='testsuite' else r.findall('.//testsuite')
          t=sum(int(s.get('tests',0)) for s in suites); f=sum(int(s.get('failures',0)) for s in suites)
          e=sum(int(s.get('errors',0)) for s in suites); sk=sum(int(s.get('skipped',0)) for s in suites)
          a=sum(int(float(s.get('assertions',0) or 0)) for s in suites)
          verdict='GREEN' if f==0 and e==0 else 'RED'
          print(f'VERDICT: {verdict} — {t} tests / {a} assertions / {f}F {e}E {sk}S (ref: ${{ github.event.inputs.ref }})')
          PY

      - name: Hygiene — the runner disk never carries the source out
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE" && echo "the ephemeral checkout destroyed"
